files:
  - path: /etc/my.cnf
    content: |
      [client]
      user = {database[user]}
      password = {database[password]}
      host = {database[host]}
      port = {database[port]}
  - path: /opt/app/.env
    content: |
      DB_NAME={database[name]}
      DB_USER={database[user]}
      DB_PASSWORD={database[password]}
