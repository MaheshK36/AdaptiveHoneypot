files:
  - path: /home/{ssh_login_username}/.ssh/id_ed25519
    mode: "0600"
    content: |
      {ssh_keys[private_key]}
  - path: /home/{ssh_login_username}/.ssh/id_ed25519.pub
    mode: "0644"
    content: "{ssh_keys[public_key]}"
  - path: /etc/sudoers.d/{ssh_login_username}
    mode: "0440"
    content: "{ssh_login_username} ALL=(ALL) NOPASSWD: ALL"
  - path: /home/{ssh_login_username}/notes.txt
    http_public: true
    content: "Application database account: {database[user]} on {database[host]}."
